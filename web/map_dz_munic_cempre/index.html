<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Zoom Amazônia — IBGE CEMPRE</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="apppanel">
  <div class="menucol">
    <h2 class="plot_name" id="plot_name"></h2>
    <p class="plot_desc" id="plot_desc"></p>
    <hr>
    <p class="vars" id="label_var_name"></p>
    <div class="var_selec_group">
      <label id="label_x_name" for="x-select"></label>
      <select id="x-select"></select>
    </div>
    <div class="var_selec_group slider-inline">
      <label id="label_year" for="year-slider"></label>
      <div class="slider-row">
        <button id="play-btn" class="icon-btn" title="Play/Pause">&#9654;</button>
        <input type="range" id="year-slider" step="1">
        <span id="year-value" class="year-value"></span>
      </div>
    </div>
    <div class="spacer"></div>
    <button id="lang-toggle" class="btn-primary">
      <span class="icon">&#127760;</span> <span id="lang-toggle-label"></span>
    </button>
  </div>
  <div class="plotcol">
    <div class="plot-title" id="plot-title"></div>
    <div class="plot-subtitle" id="plot-subtitle"></div>
    <div class="map-wrap">
      <div id="map"></div>
      <div id="spinner" class="spinner"></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
