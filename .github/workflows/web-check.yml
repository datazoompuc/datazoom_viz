name: Check web/ static apps

on:
  pull_request:
    branches: [main]
    paths:
      - "web/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files parse
        run: |
          set -e
          find web -name "*.json" -print0 | while IFS= read -r -d "" f; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" || { echo "Invalid JSON: $f"; exit 1; }
          done

      - name: Validate JS syntax
        run: |
          set -e
          find web -name "*.js" -print0 | while IFS= read -r -d "" f; do
            node --check "$f" || { echo "Syntax error: $f"; exit 1; }
          done
