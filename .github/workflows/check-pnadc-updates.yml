name: Check PNADC updates TEST

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1'   # segunda-feira 12:00 UTC = 09:00 em Brasília (BRT)

jobs:
  check-pnadc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install packages and run script
        shell: bash
        run: |
          Rscript -e "install.packages(
            c('readr','dplyr','purrr','stringr','httr','tibble','tidyr'),
            repos = 'https://cloud.r-project.org',
            dependencies = TRUE
          )"
          Rscript -e "library(httr); packageVersion('httr')"
          Rscript scripts/check_pnadc_updates.R

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: pnadc-update-report
          path: reports/pnadc_update_status.csv
