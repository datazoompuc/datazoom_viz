name: Check PNADC updates

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1' # 09:00 horário de Brasília toda segunda-feira

jobs:
  check-pnadc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libcurl4-openssl-dev libxml2-dev

      - name: Install required packages
        run: |
          Rscript -e "install.packages(
            c('readr','dplyr','purrr','stringr','httr','tibble','tidyr'),
            repos = 'https://cloud.r-project.org',
            type = 'both'
          )"

      - name: Run PNADC update check
        run: Rscript scripts/check_pnadc_updates.R

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: pnadc-update-report
          path: reports/pnadc_update_status.csv
