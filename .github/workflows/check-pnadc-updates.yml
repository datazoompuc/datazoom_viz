name: Check PNADC updates

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1' # 09:00 horário de Brasília toda segunda-feira

jobs:
  check-pnadc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libcurl4-openssl-dev libxml2-dev

      - name: Install required packages
        run: |
          Rscript -e "install.packages(
            c('readr','dplyr','purrr','stringr','httr','tibble','tidyr'),
            repos = 'https://cloud.r-project.org'
          )"

      - name: Run PNADC update check
        run: Rscript scripts/check_pnadc_updates.R

      - name: Check for outdated datasets
        id: check_outdated
        run: |
          # Extrai os nomes dos datasets desatualizados
          OUTDATED_LIST=$(awk -F',' 'NR>1 && $5=="OUTDATED" {print "• " $1}' reports/pnadc_update_status.csv)

          if [ -n "$OUTDATED_LIST" ]; then
            echo "has_outdated=true" >> $GITHUB_OUTPUT
            # Salva a lista em variável multiline
            {
              echo 'outdated_list<<EOF'
              echo "$OUTDATED_LIST"
              echo 'EOF'
            } >> $GITHUB_OUTPUT
          else
            echo "has_outdated=false" >> $GITHUB_OUTPUT
          fi

      - name: Notify Slack if outdated
        if: steps.check_outdated.outputs.has_outdated == 'true'
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":warning: *PNADC desatualizada — ação necessária*\n\nOs seguintes datasets estão desatualizados em relação ao IBGE:\n${{ steps.check_outdated.outputs.outdated_list }}\n\nAtualize as bases e faça o redeploy dos apps Shiny correspondentes.\n\n_Verificação automática via GitHub Actions — <https://github.com/datazoompuc/datazoom_viz/actions|Ver workflow>_"
            }

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: pnadc-update-report
          path: reports/pnadc_update_status.csv
