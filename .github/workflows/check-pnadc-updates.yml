name: Check PNADC updates

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1' # 09:00 horário de Brasília toda segunda-feira

jobs:
  check-pnadc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install required packages
        shell: bash
        run: |
          Rscript -e "install.packages(
            c('curl','httr','readr','dplyr','purrr','stringr','tibble','tidyr'),
            repos = 'https://cloud.r-project.org',
            dependencies = c('Depends', 'Imports')
          )"
          Rscript -e "library(httr); packageVersion('httr')"

      - name: Run PNADC update check
        run: Rscript scripts/check_pnadc_updates.R

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: pnadc-update-report
          path: reports/pnadc_update_status.csv
